<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Builder — Two Voice TTS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141414;--panel:#1c1c1c;--panel2:#242424;--panel3:#2a2a2a;
  --border:#2e2e2e;--border2:#3a3a3a;
  --text:#f0f0f0;--muted:#888;--muted2:#555;
  --s1:#d4a017;--s1-bg:rgba(212,160,23,0.15);
  --s2:#9b59b6;--s2-bg:rgba(155,89,182,0.15);
  --accent:#4f46e5;--radius:10px;--sans:'Inter',sans-serif;
}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;}

/* TITLE BAR */
.titlebar{height:44px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:.75rem;flex-shrink:0;}
.logo{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;}
.logo-icon{width:22px;height:22px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;}
.tb-sep{width:1px;height:18px;background:var(--border2);margin:0 4px;}
.tb-btn{font-family:var(--sans);font-size:11.5px;font-weight:500;padding:5px 11px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;}
.tb-btn:hover{background:var(--panel2);color:var(--text);}
.ml{margin-left:auto;}

/* WORKSPACE */
.workspace{display:flex;flex:1;overflow:hidden;}

/* RAW PANEL */
.raw-panel{width:264px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.ph{padding:12px 14px 10px;font-size:11.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0;}
.ph svg{width:13px;height:13px;opacity:.55;flex-shrink:0;}
.raw-body{flex:1;overflow-y:auto;padding:.85rem .95rem;}
.raw-body::-webkit-scrollbar{width:3px;}
.raw-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}
.raw-text{font-size:11.5px;line-height:1.85;color:#bbb;white-space:pre-wrap;font-family:'Courier New',monospace;}

/* BUILDER */
.builder-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.builder-scroll{flex:1;overflow-y:auto;padding:1.1rem 1.4rem 2rem;}
.builder-scroll::-webkit-scrollbar{width:4px;}
.builder-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}

.field-label{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500;}
.style-input{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 11px;outline:none;transition:border-color .15s;margin-bottom:1.1rem;}
.style-input:focus{border-color:#555;}

.dialog-list{display:flex;flex-direction:column;gap:.8rem;}
.dialog-block{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative;transition:box-shadow .2s;}
.dialog-block.playing-s1{box-shadow:0 0 0 2px var(--s1);}
.dialog-block.playing-s2{box-shadow:0 0 0 2px var(--s2);}

.dialog-speaker{display:inline-flex;align-items:center;gap:6px;margin:11px 12px 7px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:var(--sans);transition:opacity .15s;}
.dialog-speaker:hover{opacity:.8;}
.dialog-speaker.s1{background:var(--s1-bg);color:var(--s1);}
.dialog-speaker.s2{background:var(--s2-bg);color:var(--s2);}
.ddot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.s1 .ddot{background:var(--s1);}
.s2 .ddot{background:var(--s2);}

.dialog-text{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.7;padding:0 12px 12px;resize:none;outline:none;min-height:52px;}
.dialog-text::placeholder{color:var(--muted2);}

.d-actions{position:absolute;top:9px;right:9px;display:flex;gap:3px;opacity:0;transition:opacity .15s;}
.dialog-block:hover .d-actions{opacity:1;}
.ibt{width:24px;height:24px;border-radius:6px;border:1px solid var(--border2);background:var(--panel2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:background .15s,color .15s;font-family:var(--sans);}
.ibt:hover{background:var(--border2);color:var(--text);}

.add-btn{width:100%;margin-top:.7rem;padding:10px;background:var(--panel2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
.add-btn:hover{background:var(--border);color:var(--text);border-color:#555;}

/* SETTINGS PANEL */
.settings-panel{width:256px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.set-scroll{flex:1;overflow-y:auto;padding:.8rem .85rem 2rem;}
.set-scroll::-webkit-scrollbar{width:3px;}
.set-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}

.set-section-label{font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.04em;margin:1rem 0 .45rem;text-transform:uppercase;}

/* Mode toggle */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.mode-btn{font-family:var(--sans);font-size:11px;font-weight:500;padding:9px 5px;border-radius:8px;border:1px solid var(--border2);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;line-height:1.3;transition:all .15s;}
.mode-btn svg{width:17px;height:17px;opacity:.45;}
.mode-btn:hover{background:var(--panel2);}
.mode-btn.active{background:var(--panel2);border-color:#555;color:var(--text);}
.mode-btn.active svg{opacity:.9;}

/* Collapsible */
.coll{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:.45rem;}
.coll-hd{display:flex;align-items:center;gap:7px;padding:10px 11px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text);user-select:none;transition:background .15s;}
.coll-hd:hover{background:var(--panel2);}
.coll-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.coll-arr{margin-left:auto;font-size:10px;color:var(--muted);transition:transform .2s;}
.coll-arr.open{transform:rotate(180deg);}
.coll-bd{padding:0 11px 11px;display:none;}
.coll-bd.open{display:block;}

/* Fields inside collapsible */
.sf{margin-top:9px;}
.sf label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500;}
.si{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:var(--sans);font-size:12.5px;padding:7px 9px;outline:none;transition:border-color .15s;}
.si:focus{border-color:#555;}
.sw{position:relative;}
.sw::before{content:'♪';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none;z-index:1;}
.ss{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:var(--sans);font-size:12px;padding:7px 26px 7px 28px;outline:none;cursor:pointer;appearance:none;transition:border-color .15s;}
.ss:focus{border-color:#555;}
.sarr{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--muted);pointer-events:none;}

/* Model rows */
.mrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);}
.mrow:last-child{border:none;}
.mrow-lbl{font-size:11.5px;color:var(--muted);}
.mrow-val{font-size:11.5px;color:var(--text);font-weight:500;}
.mrow-col{flex-direction:column;align-items:flex-start;gap:5px;}
input[type=range].mslider{width:100%;accent-color:var(--accent);height:3px;}

/* BOTTOM BAR */
.bottombar{height:52px;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 1.1rem;gap:.45rem;flex-shrink:0;}
.preset-btn{font-family:var(--sans);font-size:11.5px;font-weight:500;padding:6px 12px;border-radius:99px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;}
.preset-btn:hover{border-color:#666;color:var(--text);background:var(--panel2);}
.sp{flex:1;}
.stop-btn{font-family:var(--sans);font-size:12px;font-weight:500;padding:7px 13px;border-radius:7px;border:1px solid var(--border2);background:var(--panel2);color:var(--muted);cursor:pointer;transition:all .15s;display:none;}
.stop-btn:hover{border-color:#e55;color:#e55;}
.stop-btn.visible{display:block;}
.run-btn{font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 18px;border-radius:8px;border:none;background:var(--text);color:var(--bg);cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .15s,transform .1s;white-space:nowrap;}
.run-btn:hover{opacity:.85;}
.run-btn:active{transform:scale(.97);}
.run-btn.running{background:#333;color:var(--muted);cursor:default;}
.kb{font-size:11px;color:var(--muted2);font-weight:400;}
.spill{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--border2);color:var(--muted);display:none;}
.spill.on{display:block;}
.spill.live{border-color:var(--accent);color:#a5b4fc;}

#nosup{display:none;padding:9px 14px;background:#3a1a1a;color:#f87171;font-size:12px;border-bottom:1px solid #552222;flex-shrink:0;}
</style>
</head>
<body>

<div class="titlebar">
  <div class="logo"><div class="logo-icon">S</div> Script Builder</div>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="loadPreset('podcast')">Podcast</button>
  <button class="tb-btn" onclick="loadPreset('assistant')">Assistant</button>
  <button class="tb-btn" onclick="loadPreset('movie')">Movie</button>
</div>

<div id="nosup">Web Speech API not supported — please use Google Chrome or Microsoft Edge.</div>

<div class="workspace">

  <!-- RAW -->
  <div class="raw-panel">
    <div class="ph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
      Raw structure
    </div>
    <div class="raw-body"><div class="raw-text" id="raw-text">—</div></div>
  </div>

  <!-- BUILDER -->
  <div class="builder-panel">
    <div class="ph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Script builder
    </div>
    <div class="builder-scroll" id="bscroll">
      <div class="field-label">Style instructions</div>
      <input class="style-input" id="style-input" type="text"
        placeholder="e.g. Read aloud in a warm, welcoming tone"
        value="Read aloud in a warm, welcoming tone" oninput="updateRaw()">
      <div class="dialog-list" id="dlist"></div>
      <button class="add-btn" onclick="addBlock()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        Add dialog
      </button>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="settings-panel">
    <div class="ph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      Settings
    </div>
    <div class="set-scroll">

      <div class="set-section-label">Mode</div>
      <div class="mode-grid">
        <button class="mode-btn" id="mode-single" onclick="setMode('single')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M6 20v-1a6 6 0 0 1 12 0v1"/></svg>
          Single-speaker<br>audio
        </button>
        <button class="mode-btn active" id="mode-multi" onclick="setMode('multi')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="8" r="3.5"/><path d="M3 20v-1a6 6 0 0 1 9-5.46M12.5 20v-1a6 6 0 0 1 10 0v1"/></svg>
          Multi-speaker<br>audio
        </button>
      </div>

      <div class="set-section-label">Model settings</div>
      <div class="coll">
        <div class="coll-hd" onclick="toggleColl('model-bd','model-arr')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>Audio model</span>
          <span class="coll-arr" id="model-arr">▾</span>
        </div>
        <div class="coll-bd" id="model-bd">
          <div class="mrow"><span class="mrow-lbl">Format</span><span class="mrow-val">MP3</span></div>
          <div class="mrow"><span class="mrow-lbl">Quality</span><span class="mrow-val">Standard</span></div>
          <div class="mrow mrow-col">
            <span class="mrow-lbl">Speed &nbsp;<span id="spd-v" style="color:var(--text);font-weight:500">1.0×</span></span>
            <input type="range" class="mslider" min="0.5" max="2" step="0.1" value="1" id="spd-sl"
              oninput="document.getElementById('spd-v').textContent=parseFloat(this.value).toFixed(1)+'×'">
          </div>
          <div class="mrow mrow-col">
            <span class="mrow-lbl">Volume &nbsp;<span id="vol-v" style="color:var(--text);font-weight:500">100%</span></span>
            <input type="range" class="mslider" min="0" max="1" step="0.05" value="1" id="vol-sl"
              oninput="document.getElementById('vol-v').textContent=Math.round(this.value*100)+'%'">
          </div>
        </div>
      </div>

      <div class="set-section-label">Speaker settings</div>

      <!-- Speaker 1 -->
      <div class="coll">
        <div class="coll-hd" onclick="toggleColl('s1-bd','s1-arr')">
          <div class="coll-dot" style="background:var(--s1)"></div>
          <span id="s1-hd-name">Speaker 1 settings</span>
          <span class="coll-arr open" id="s1-arr">▾</span>
        </div>
        <div class="coll-bd open" id="s1-bd">
          <div class="sf">
            <label>Name</label>
            <input class="si" id="name-s1" type="text" value="Speaker 1"
              oninput="syncSpeakerName(1,this.value)">
          </div>
          <div class="sf">
            <label>Voice</label>
            <div class="sw">
              <select class="ss" id="voice-s1"></select>
              <span class="sarr">▾</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Speaker 2 -->
      <div class="coll" id="s2-coll">
        <div class="coll-hd" onclick="toggleColl('s2-bd','s2-arr')">
          <div class="coll-dot" style="background:var(--s2)"></div>
          <span id="s2-hd-name">Speaker 2 settings</span>
          <span class="coll-arr open" id="s2-arr">▾</span>
        </div>
        <div class="coll-bd open" id="s2-bd">
          <div class="sf">
            <label>Name</label>
            <input class="si" id="name-s2" type="text" value="Speaker 2"
              oninput="syncSpeakerName(2,this.value)">
          </div>
          <div class="sf">
            <label>Voice</label>
            <div class="sw">
              <select class="ss" id="voice-s2"></select>
              <span class="sarr">▾</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div><!-- workspace -->

<div class="bottombar">
  <button class="preset-btn" onclick="loadPreset('podcast')">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M6.34 17.66a8 8 0 1 1 11.32 0"/></svg>
    Podcast transcript
  </button>
  <button class="preset-btn" onclick="loadPreset('assistant')">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.64 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.55 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    Audio voice assistant
  </button>
  <button class="preset-btn" onclick="loadPreset('movie')">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20"/></svg>
    Movie scene script
  </button>
  <div class="sp"></div>
  <div class="spill" id="spill"></div>
  <button class="stop-btn" id="stop-btn" onclick="stopAll()">&#9632; Stop</button>
  <button class="run-btn" id="run-btn" onclick="runScript()">Run <span class="kb">Ctrl ↵</span></button>
</div>

<script>
const synth = window.speechSynthesis;
if (!synth) document.getElementById('nosup').style.display='block';

let allVoices=[],blocks=[],isRunning=false,stopReq=false,mode='multi';

/* Gender detection */
const FEM=['google us english','google uk english female','samantha','karen','victoria','zira','aria','jenny','libby','neerja','heera','raveena','veena','moana','tessa','fiona','alice','allison','ava','susan','zoe','xiaoxiao','xiaoyi','nanami','aoi','mayu','amelie','joana','luciana','paulina','penelope','soledad','monica','serena','laura','elsa','sara','anna','lena','petra','hanna','ioana','leila','tamar','mariam','amira','layla','dalia','salma','emily','claire','sophie','nicky'];
const MAL=['google uk english male','daniel','david','mark','guy','ryan','eric','ravi','jorge','antonio','diego','miguel','carlos','thomas','pierre','stefan','jan','felix','lucas','nicolas','matteo','luca','marco','alex','fred','ralph','yunyang','yunfeng','keita','daichi'];

function gender(v){
  const n=v.name.toLowerCase();
  for(const f of FEM)if(n.includes(f))return'female';
  for(const m of MAL)if(n.includes(m))return'male';
  return'unknown';
}

function populateVoices(){
  allVoices=synth.getVoices();
  if(!allVoices.length)return;
  const pref=allVoices.filter(v=>v.name.includes('Google')||v.name.includes('Microsoft')||v.name.includes('Samantha')||v.name.includes('Karen')||v.name.includes('Daniel'));
  const rest=allVoices.filter(v=>!pref.includes(v));
  const sorted=[...pref,...rest];
  const F=sorted.filter(v=>gender(v)==='female');
  const M=sorted.filter(v=>gender(v)==='male');
  const O=sorted.filter(v=>gender(v)==='unknown');
  function fill(id,p,pl,s,sl){
    const el=document.getElementById(id);el.innerHTML='';
    [[pl,p],[sl,s],['Other',O]].forEach(([lbl,lst])=>{
      if(!lst.length)return;
      const og=document.createElement('optgroup');og.label=lbl;
      lst.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name.replace(/Microsoft\s|Google\s/g,'').replace(/\(.*?\)/g,'').trim().slice(0,28);og.appendChild(o);});
      el.appendChild(og);
    });
  }
  fill('voice-s1',F,'♀ Female',M,'♂ Male');
  fill('voice-s2',M,'♂ Male',F,'♀ Female');
  const bF=F.find(v=>v.name.includes('Google')&&v.lang.startsWith('en'))||F.find(v=>v.lang.startsWith('en'))||F[0];
  const bM=M.find(v=>v.name.includes('Google')&&v.lang.startsWith('en'))||M.find(v=>v.lang.startsWith('en'))||M[0];
  if(bF)document.getElementById('voice-s1').value=bF.name;
  if(bM)document.getElementById('voice-s2').value=bM.name;
}
synth.onvoiceschanged=populateVoices;populateVoices();

function setMode(m){
  mode=m;
  document.getElementById('mode-single').classList.toggle('active',m==='single');
  document.getElementById('mode-multi').classList.toggle('active',m==='multi');
  document.getElementById('s2-coll').style.display=m==='single'?'none':'';
  rebuildList();
}

function toggleColl(bid,aid){
  const b=document.getElementById(bid),a=document.getElementById(aid);
  const o=b.classList.toggle('open');a.classList.toggle('open',o);
}

function syncSpeakerName(n,val){
  const hd=document.getElementById('s'+n+'-hd-name');
  if(hd)hd.textContent=(val||'Speaker '+n)+' settings';
  rebuildList();
}

function spkName(s){return document.getElementById('name-'+s)?.value.trim()||(s==='s1'?'Speaker 1':'Speaker 2');}

/* BLOCKS */
function addBlock(spk,txt){
  const last=blocks.length?blocks[blocks.length-1].speaker:'s2';
  const ns=spk||(mode==='single'?'s1':last==='s1'?'s2':'s1');
  blocks.push({speaker:ns,text:txt||''});
  rebuildList();
  setTimeout(()=>{const s=document.getElementById('bscroll');s.scrollTop=s.scrollHeight;},50);
}

function rebuildList(){
  document.getElementById('dlist').innerHTML='';
  blocks.forEach((_,i)=>renderBlock(i));
  updateRaw();
}

function renderBlock(i){
  const b=blocks[i];
  const el=document.createElement('div');
  el.className='dialog-block';el.id='block-'+i;
  const nm=spkName(b.speaker);
  el.innerHTML=`
    <div class="d-actions">
      ${mode==='multi'?`<button class="ibt" onclick="flipSpeaker(${i})" title="Switch speaker">⇄</button>`:''}
      <button class="ibt" onclick="moveBlock(${i},-1)">↑</button>
      <button class="ibt" onclick="moveBlock(${i},1)">↓</button>
      <button class="ibt" onclick="delBlock(${i})">✕</button>
    </div>
    <button class="dialog-speaker ${b.speaker}" onclick="${mode==='multi'?`flipSpeaker(${i})`:'void(0)'}">
      <div class="ddot"></div>${nm}
    </button>
    <textarea class="dialog-text" id="t-${i}" placeholder="Type dialog here…" rows="2"
      oninput="blocks[${i}].text=this.value;resize(this);updateRaw()">${b.text}</textarea>`;
  document.getElementById('dlist').appendChild(el);
  resize(el.querySelector('textarea'));
}

function flipSpeaker(i){blocks[i].speaker=blocks[i].speaker==='s1'?'s2':'s1';rebuildList();}
function delBlock(i){blocks.splice(i,1);rebuildList();}
function moveBlock(i,d){const n=i+d;if(n<0||n>=blocks.length)return;[blocks[i],blocks[n]]=[blocks[n],blocks[i]];rebuildList();}
function resize(ta){ta.style.height='auto';ta.style.height=Math.max(48,ta.scrollHeight)+'px';}

function updateRaw(){
  const st=document.getElementById('style-input').value.trim();
  let r=st?st+'\n':'';
  blocks.forEach(b=>{r+=`${spkName(b.speaker)}: ${b.text||'…'}\n`;});
  document.getElementById('raw-text').textContent=r.trim()||'—';
}

/* PRESETS */
const PRESETS={
  podcast:{style:'Read in an engaging, natural podcast tone',lines:[
    {s:'s1',t:"Welcome back to the show! Today we're diving into something really exciting."},
    {s:'s2',t:"That's right! We've been looking forward to this topic all week. Let's get into it."},
    {s:'s1',t:"So where should we start? I think understanding the basics first is key."},
    {s:'s2',t:"Absolutely. And once you grasp the fundamentals, everything else clicks into place."},
  ]},
  assistant:{style:'Read in a clear, professional assistant voice',lines:[
    {s:'s1',t:"Hello! How can I help you today?"},
    {s:'s2',t:"I'd like to know more about the features available."},
    {s:'s1',t:"Of course! I can walk you through everything step by step."},
    {s:'s2',t:"That would be great. I'm especially curious about the voice options."},
  ]},
  movie:{style:'Read with dramatic cinematic delivery',lines:[
    {s:'s1',t:"You don't have to do this alone. We can face it together."},
    {s:'s2',t:"Some battles aren't meant to be shared. This one is mine."},
    {s:'s1',t:"Then let me stand beside you. Not to fight — just so you're not in the dark."},
    {s:'s2',t:"Alright. But if things go wrong, you run. Promise me that."},
  ]}
};

function loadPreset(k){
  const p=PRESETS[k];
  document.getElementById('style-input').value=p.style;
  blocks=[];document.getElementById('dlist').innerHTML='';
  p.lines.forEach(l=>addBlock(l.s,l.t));
}

/* RUN */
function getVoice(name){return allVoices.find(v=>v.name===name)||null;}

async function runScript(){
  if(isRunning)return;
  if(!blocks.length){pill('Add some dialog first.',false);return;}
  isRunning=true;stopReq=false;
  document.getElementById('run-btn').classList.add('running');
  document.getElementById('stop-btn').classList.add('visible');
  pill('Running…',true);
  const spd=parseFloat(document.getElementById('spd-sl').value);
  const vol=parseFloat(document.getElementById('vol-sl').value);
  for(let i=0;i<blocks.length;i++){
    if(stopReq)break;
    const b=blocks[i];
    if(!b.text.trim())continue;
    document.querySelectorAll('.dialog-block').forEach(e=>e.classList.remove('playing-s1','playing-s2'));
    const bel=document.getElementById('block-'+i);
    if(bel){bel.classList.add('playing-'+b.speaker);bel.scrollIntoView({behavior:'smooth',block:'nearest'});}
    const vn=b.speaker==='s1'?document.getElementById('voice-s1').value:document.getElementById('voice-s2').value;
    await say(b.text,getVoice(vn),spd,vol);
    await wait(100);
  }
  document.querySelectorAll('.dialog-block').forEach(e=>e.classList.remove('playing-s1','playing-s2'));
  isRunning=false;
  document.getElementById('run-btn').classList.remove('running');
  document.getElementById('stop-btn').classList.remove('visible');
  pill(stopReq?'Stopped.':'Done.',false);
  setTimeout(()=>pill('',false),2800);
}

function say(text,voice,rate=1,volume=1){
  return new Promise(res=>{
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.voice=voice||null;u.rate=rate;u.volume=volume;u.pitch=1;
    u.onend=res;u.onerror=res;synth.speak(u);
  });
}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

function stopAll(){
  stopReq=true;synth.cancel();isRunning=false;
  document.getElementById('run-btn').classList.remove('running');
  document.getElementById('stop-btn').classList.remove('visible');
  document.querySelectorAll('.dialog-block').forEach(e=>e.classList.remove('playing-s1','playing-s2'));
  pill('Stopped.',false);setTimeout(()=>pill('',false),2000);
}

function pill(msg,live){
  const p=document.getElementById('spill');
  p.textContent=msg;p.classList.toggle('on',!!msg);p.classList.toggle('live',!!live);
}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runScript();}
  if(e.key==='Escape'&&isRunning)stopAll();
});

loadPreset('podcast');
</script>
