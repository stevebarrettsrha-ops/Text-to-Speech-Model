name: Tests

# No deploy job: Script Builder is a local server that drives ComfyUI on your
# own machine, so there is nothing to publish. This only checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The gate from CLAUDE.md: a missing declaration in the inline script
      # kills all interactivity silently, and nothing here needs the app
      # running, so it is the cheap check that goes first.
      - run: node tests/check.mjs

  units:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the launchers enforce; 3.13 is what a new install
        # of Python gives you today.
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    needs: [check, units]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r requirements.txt
      # No lockfile is committed, so this is `install` rather than `ci`.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # The stand-ins under tests/ answer for ComfyUI and HuggingFace, so this
      # needs no GPU, no model downloads and no network.
      - run: npm test
